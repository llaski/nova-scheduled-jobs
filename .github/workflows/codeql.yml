# Advanced CodeQL setup using the security-and-quality query suite.
# This replaces CodeQL default setup (disable default setup in repo settings
# if both appear active: Settings → Advanced Security → CodeQL analysis).
#
# Scans JavaScript/TypeScript (including Vue) and GitHub Actions workflows.
# PHP is not supported by CodeQL.

name: "CodeQL"

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    # Weekly Sunday 06:17 UTC
    - cron: "17 6 * * 0"

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            build-mode: none
          - language: actions
            build-mode: none

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
